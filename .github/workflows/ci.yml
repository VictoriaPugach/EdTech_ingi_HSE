name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------------------
  # TypeScript: lint, typecheck, build (web + realtime-sync + api-gateway + shared)
  # ----------------------------------------------------------------------------
  typescript:
    name: TS — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api-gateway

      - name: Lint
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Build (all workspaces)
        run: npm run build

  # ----------------------------------------------------------------------------
  # Python: lint (ruff), format-check (black), tests (pytest)
  # ----------------------------------------------------------------------------
  python:
    name: Python — lint & test (hint-service)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/hint-service
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/hint-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: black --check src tests

      - name: Pytest
        run: pytest -q

  # ----------------------------------------------------------------------------
  # Docker: проверка, что все Dockerfile-ы собираются
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker — build all images
    runs-on: ubuntu-latest
    needs: [typescript, python]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api-gateway (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api-gateway/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build realtime-sync (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/realtime-sync/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build hint-service (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/hint-service
          file: apps/hint-service/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
