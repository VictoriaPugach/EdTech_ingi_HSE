name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------------------------------------------
  # TypeScript: lint, typecheck, build (web + realtime-sync + api-gateway + shared)
  # ----------------------------------------------------------------------------
  typescript:
    name: TS — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api-gateway

      - name: Lint
        run: npm run lint

      - name: Typecheck (all workspaces)
        run: npm run typecheck

      - name: Build (all workspaces)
        run: npm run build

  # ----------------------------------------------------------------------------
  # Python: lint (ruff), format-check (black), tests (pytest)
  # ----------------------------------------------------------------------------
  python:
    name: Python — lint & test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [hint-service, telegram-bot]
    defaults:
      run:
        working-directory: apps/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: apps/${{ matrix.service }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: black --check src tests

      - name: Pytest
        run: pytest -q

  # ----------------------------------------------------------------------------
  # Docker: собрать все образы. На PR — только сборка (проверка Dockerfile-ов).
  # На push в main — пуш в ghcr.io с тегами :<git-sha> и :latest (для деплоя ниже).
  # ----------------------------------------------------------------------------
  docker-build:
    name: Docker — build & push images
    runs-on: ubuntu-latest
    needs: [typescript, python]
    permissions:
      contents: read
      packages: write   # пуш образов в ghcr.io
    outputs:
      prefix: ${{ steps.meta.outputs.prefix }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io требует имя владельца/репозитория в нижнем регистре.
      - name: Compute image prefix
        id: meta
        run: echo "prefix=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Логинимся в ghcr.io только когда реально пушим (push в main).
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api-gateway (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api-gateway/Dockerfile
          target: prod
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/api-gateway:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}/api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push realtime-sync (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/realtime-sync/Dockerfile
          target: prod
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/realtime-sync:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}/realtime-sync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push hint-service (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/hint-service
          file: apps/hint-service/Dockerfile
          target: prod
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/hint-service:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}/hint-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push telegram-bot (prod)
        uses: docker/build-push-action@v6
        with:
          context: ./apps/telegram-bot
          file: apps/telegram-bot/Dockerfile
          target: prod
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/telegram-bot:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}/telegram-bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # web вшивает адреса API/WS в бандл на этапе сборки → передаём их build-аргами
      # из GitHub Variables (vars.PUBLIC_URL / vars.PUBLIC_WS_URL).
      - name: Build & push web (prod)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: prod
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VITE_API_URL=${{ vars.PUBLIC_URL }}
            VITE_WS_URL=${{ vars.PUBLIC_WS_URL }}
          tags: |
            ${{ steps.meta.outputs.prefix }}/web:${{ github.sha }}
            ${{ steps.meta.outputs.prefix }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # Deploy: только на push в main, после зелёного CI. Заходим по SSH на VPS,
  # обновляем конфиги (git pull), тянем свежие образы из ghcr.io и поднимаем стек
  # без локальной сборки. Затем применяем миграции БД.
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          IMAGE_PREFIX: ${{ needs.docker-build.outputs.prefix }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR,IMAGE_PREFIX,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-$HOME/edtech}"

            # Обновляем только конфиги стека (compose/Caddyfile). Код приложения
            # уже собран в образы — на сервере его собирать не нужно.
            git pull --ff-only

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            export IMAGE_PREFIX IMAGE_TAG
            C="docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod"

            $C pull
            $C up -d --no-build
            $C run --rm api-gateway npx prisma migrate deploy

            docker logout ghcr.io
            docker image prune -f
