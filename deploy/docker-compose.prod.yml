# =============================================================================
#  Production-стек для тестового сервера (один VPS + Docker).
#
#  Запуск (из корня репозитория):
#    docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod up -d --build
#
#  Наружу открыт только Caddy (80/443) — он терминирует HTTPS и проксирует:
#    https://DOMAIN/        → web (статика SPA)
#    https://DOMAIN/api/*   → api-gateway
#    https://DOMAIN/ws*     → realtime-sync (WebSocket / CRDT)
#  Видео (LiveKit) подключается напрямую к LIVEKIT_URL (рекомендуется LiveKit Cloud).
#  Postgres и Redis наружу НЕ публикуются — только во внутренней сети.
#
#  Образы приложения параметризованы (IMAGE_PREFIX/IMAGE_TAG):
#    • CI/CD: образы собираются в GitHub Actions и пушатся в ghcr.io; сервер их
#      только тянет — `docker compose pull && up -d --no-build`
#      (IMAGE_PREFIX=ghcr.io/<owner>/<repo>, IMAGE_TAG=<git-sha>).
#    • Вручную (без registry): переменные не заданы → дефолт edtech/<svc>:local,
#      `up -d --build` соберёт и протегирует образы локально.
# =============================================================================

name: edtech-prod

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, api-gateway, realtime-sync]
    networks: [edtech]

  web:
    image: ${IMAGE_PREFIX:-edtech}/web:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: prod
      args:
        VITE_API_URL: ${PUBLIC_URL}
        VITE_WS_URL: ${PUBLIC_WS_URL}
    restart: unless-stopped
    networks: [edtech]

  api-gateway:
    image: ${IMAGE_PREFIX:-edtech}/api-gateway:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      GATEWAY_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-24h}
      HINT_SERVICE_URL: http://hint-service:4002
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    networks: [edtech]

  realtime-sync:
    image: ${IMAGE_PREFIX:-edtech}/realtime-sync:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/realtime-sync/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      REALTIME_PORT: 4001
      REALTIME_WS_PATH: /ws
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      # В проде требуем валидный сессионный токен на WS (НФТ-5).
      REQUIRE_AUTH: 'true'
    depends_on:
      redis:    { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [edtech]

  hint-service:
    image: ${IMAGE_PREFIX:-edtech}/hint-service:${IMAGE_TAG:-local}
    build:
      context: ../apps/hint-service
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      ENV: production
      HINT_SERVICE_PORT: 4002
    networks: [edtech]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [edtech]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [edtech]

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  edtech:
    driver: bridge
