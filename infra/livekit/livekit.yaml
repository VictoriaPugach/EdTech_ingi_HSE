# =============================================================================
#  LiveKit SFU — dev-конфиг (ADR video-livekit-sfu)
#  Медиасервер для группового видео занятий. Кластеризация — через тот же Redis,
#  что и Realtime Sync (отдельные ключи). Прод-настройки (external IP, TURN,
#  UDP-диапазон, TLS) задаются отдельно в K8s.
# =============================================================================

port: 7880
bind_addresses:
  - ''

rtc:
  tcp_port: 7881
  # Небольшой UDP-диапазон для dev (проброшен в docker-compose).
  port_range_start: 50000
  port_range_end: 50020
  use_external_ip: false
  # Локальная разработка: сервер анонсирует 127.0.0.1, чтобы браузер на хосте
  # достучался до проброшенных портов контейнера. В проде убрать (внешний IP).
  node_ip: 127.0.0.1

# Координация кластера и комнат через общий Redis (НФТ-2).
redis:
  address: redis:6379

# Ключ/секрет для подписи access-токенов. Должны совпадать с LIVEKIT_API_KEY /
# LIVEKIT_API_SECRET в API Gateway. В проде — секрет из vault, не из файла.
keys:
  devkey: devsecret_change_me_min_32_chars_long

logging:
  level: info
