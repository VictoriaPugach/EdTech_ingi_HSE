# SPA: любые маршруты (/s/:id, /courses/...) отдаём через index.html,
# иначе nginx вернёт 404 при обновлении страницы по прямой ссылке.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Статика с длинным кэшем (файлы Vite имеют хэш в имени).
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
